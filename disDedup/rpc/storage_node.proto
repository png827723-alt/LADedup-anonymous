syntax = "proto3";

package rpc;

option go_package = "dedup-system/rpc;rpc";

message PutChunkRequest {
  string hash = 1;
  bytes data = 2;
}

message PutChunkResponse {
  bool already_exists = 1;
}

message PutSyntheticChunkRequest {
  string hash = 1;
  int64 size = 2;
}

message PutSyntheticChunkResponse {
  bool already_exists = 1;
}

message PutChunkItem {
  string hash = 1;
  bytes data = 2;
}

message PutSyntheticChunkItem {
  string hash = 1;
  int64 size = 2;
}

message BatchPutRequest {
  repeated PutChunkItem chunks = 1;
}

message BatchPutResponse {
  int32 accepted_chunks = 1;
}

message BatchPutSyntheticRequest {
  repeated PutSyntheticChunkItem chunks = 1;
}

message BatchPutSyntheticResponse {
  int32 accepted_chunks = 1;
}

message BatchGetRequest {
  repeated string hashes = 1;
}

message BatchGetMetrics {
  int32 request_chunks = 1;
  int32 found_chunks = 2;
  int32 missing_chunks = 3;
  int64 bytes_returned = 4;
  double index_lookup_seconds = 5;
  double engine_get_seconds = 6;
  double response_build_seconds = 7;
  double handler_total_seconds = 8;
}

message ChunkData {
  string hash = 1;
  bytes data = 2;
  bool found = 3;
  string error = 4;
}

message BatchGetResponse {
  repeated ChunkData chunks = 1;
  BatchGetMetrics metrics = 2;
}

message UploadFullFileChunk {
  string name = 1;
  bytes data = 2;
}

message UploadFullFileResponse {
  int64 bytes_received = 1;
}

message DownloadFullFileRequest {
  string name = 1;
}

message DownloadFullFileChunk {
  bytes data = 1;
}

message FlushRequest {}
message FlushResponse {}
message PingRequest {}

message PingResponse {
  string node_id = 1;
  string role = 2;
  string storage_granularity = 3;
}

service StorageNode {
  rpc PutChunk(PutChunkRequest) returns (PutChunkResponse);
  rpc BatchPut(BatchPutRequest) returns (BatchPutResponse);
  rpc PutSyntheticChunk(PutSyntheticChunkRequest) returns (PutSyntheticChunkResponse);
  rpc BatchPutSynthetic(BatchPutSyntheticRequest) returns (BatchPutSyntheticResponse);
  rpc BatchGet(BatchGetRequest) returns (BatchGetResponse);
  rpc UploadFullFile(stream UploadFullFileChunk) returns (UploadFullFileResponse);
  rpc DownloadFullFile(DownloadFullFileRequest) returns (stream DownloadFullFileChunk);
  rpc Flush(FlushRequest) returns (FlushResponse);
  rpc Ping(PingRequest) returns (PingResponse);
}
