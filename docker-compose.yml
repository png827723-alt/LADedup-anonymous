x-netem-node: &netem_node
  cap_add: ["NET_ADMIN"]
  entrypoint: ["sh", "-lc", "/netem.sh && exec \"$@\"", "--"]

x-netem-manager: &netem_manager
  cap_add: ["NET_ADMIN"]
  entrypoint: ["sh", "-lc", "/netem_manager.sh && exec \"$@\"", "--"]

x-edge-netem-env: &edge_netem_env
  NET_IFACE: ${NET_IFACE:-eth0}
  NET_RATE: ${EDGE_NET_RATE:-1500mbit}
  NET_DELAY: ${EDGE_NET_DELAY:-1ms}
  NET_JITTER: ${EDGE_NET_JITTER:-0.4ms}
  NET_LOSS: ${EDGE_NET_LOSS:-0%}
  NET_BURST: ${EDGE_NET_BURST:-32kbit}
  NET_LATENCY: ${EDGE_NET_LATENCY:-400ms}

services:
  cloud:
    <<: *netem_node
    image: disdedup:latest
    # user: "${HOST_UID}:${HOST_GID}"
    cap_add: ["NET_ADMIN"]
    environment:
      NET_IFACE: ${NET_IFACE:-eth0}
      NET_RATE: ${CLOUD_NET_RATE:-100mbit}
      NET_DELAY: ${CLOUD_NET_DELAY:-25ms}
      NET_JITTER: ${CLOUD_NET_JITTER:-5ms}
      NET_LOSS: ${CLOUD_NET_LOSS:-0%}
      NET_BURST: ${CLOUD_NET_BURST:-32kbit}
      NET_LATENCY: ${CLOUD_NET_LATENCY:-400ms}
    command: ["storage-node", "-config", "/cfg/cloud.yaml"]
    volumes:
      - ${CLOUD_STORE_ROOT}/cloud:/data
      - ${CLOUD_STORE_ROOT}/cloud/cloud.yaml:/cfg/cloud.yaml:ro
    ports: ["50051:50051"]

  manager:
    <<: *netem_manager
    image: disdedup:latest
    # user: "${HOST_UID}:${HOST_GID}"
    cap_add: ["NET_ADMIN"]
    environment:
      NET_IFACE: ${NET_IFACE:-eth0}
      NET_BURST: ${MANAGER_NET_BURST:-64kbit}

      # manager -> cloud
      M2C_TARGETS: ${M2C_TARGETS:-cloud}
      M2C_RATE: ${M2C_RATE:-100mbit}
      M2C_DELAY: ${M2C_DELAY:-25ms}
      M2C_JITTER: ${M2C_JITTER:-5ms}
      M2C_LOSS: ${M2C_LOSS:-0%}

      # manager -> edge
      M2E_TARGETS: ${M2E_TARGETS:-edge1 edge2 edge3 edge4 edge5 edge6 edge7 edge8 edge9 edge10}
      M2E_RATE: ${M2E_RATE:-1500mbit}
      M2E_DELAY: ${M2E_DELAY:-1ms}
      M2E_JITTER: ${M2E_JITTER:-0.4ms}
      M2E_LOSS: ${M2E_LOSS:-0%}

      # manager default class (traffic not matched by M2C/M2E)
      DEFAULT_RATE: ${MANAGER_DEFAULT_RATE:-10gbit}
    command: ["sleep", "infinity"]
    volumes:
      - ${STORE_ROOT}/manager:/data
      - ${DATA_ROOT}:/input:ro
      - ${STORE_ROOT}/output:/output
      # 如果你要触发“placement 目录不存在 => 全按策略分发”，请注释掉下一行
      # - ${STORE_ROOT}/placement:/data/placement
      - ${STORE_ROOT}/manager/manager.yaml:/cfg/manager.yaml:ro

  edge1:
    <<: *netem_node
    image: disdedup:latest
    # user: "${HOST_UID}:${HOST_GID}"
    cap_add: ["NET_ADMIN"]
    environment: *edge_netem_env
    command: ["storage-node", "-config", "/cfg/edge1.yaml"]
    volumes:
      - ${STORE_ROOT}/edge1:/data
      - ${STORE_ROOT}/edge1/edge1.yaml:/cfg/edge1.yaml:ro
    ports: ["50052:50052"]

